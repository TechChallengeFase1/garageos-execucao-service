# Ambiente local do Execução Service: a API e o PostgreSQL proprio do servico.
# Sobe com `docker compose up -d --build`. Swagger em http://localhost:8082/swagger
services:
  postgres:
    image: postgres:16
    container_name: garageos-execucao-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - garageos_execucao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garageos-execucao-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Swagger__Enabled: "true"
      # Rodando um servico sozinho, a mensageria fica em memoria: os eventos
      # da saga nao saem do processo. Para o fluxo entre servicos, aponte os
      # tres para o mesmo LocalStack (Mensageria__Transporte=AmazonSqs e
      # Mensageria__ServiceUrl=http://host.docker.internal:4566).
      Mensageria__Transporte: ${MENSAGERIA_TRANSPORTE:-InMemory}
      Mensageria__ServiceUrl: ${MENSAGERIA_SERVICE_URL:-}
      Mensageria__Ambiente: local
      # Local roda uma instancia so, entao migrar no startup e conveniente.
      # Em Kubernetes isto fica desligado - quem migra e o Job.
      Database__MigrateOnStartup: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-garageos-execucao (local)}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  garageos_execucao_pgdata:
