# O API Gateway manda tudo para o NLB do Traefik, e o Traefik escolhe o servico
# pelo prefixo. A API nao conhece /execucao: o middleware tira o prefixo.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tirar-prefixo
  namespace: garageos-execucao
spec:
  stripPrefix:
    prefixes:
      - /execucao
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garageos-execucao
  namespace: garageos-execucao
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: garageos-execucao-tirar-prefixo@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /execucao
            pathType: Prefix
            backend:
              service:
                name: execucao
                port:
                  name: http
