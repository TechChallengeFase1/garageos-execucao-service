# Job de migrations do Entity Framework Core.
#
# Fica em k8s/jobs/ e NAO em k8s/ de proposito: `kubectl apply -f k8s/` nao e
# recursivo. A pipeline apaga o Job anterior (a especificacao de um Job e
# imutavel), aplica este e so depois faz o rollout da API. Com o HPA, migrar na
# subida faria varias replicas migrarem em paralelo.
apiVersion: batch/v1
kind: Job
metadata:
  name: garageos-execucao-migrations
  namespace: garageos-execucao
  labels:
    app.kubernetes.io/name: garageos-execucao-migrations
    app.kubernetes.io/part-of: garageos
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: garageos-execucao-migrations
    spec:
      restartPolicy: Never
      serviceAccountName: execucao
      # Os pods nao falam com a API do cluster. O IRSA usa outro token, projetado a parte.
      automountServiceAccountToken: false
      containers:
        - name: migrations
          image: __IMAGE__
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: garageos-execucao-config
            - secretRef:
                name: garageos-execucao-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
