# Identidade dos pods na AWS (IRSA). A pipeline troca __IRSA_ROLE_ARN__ pelo valor
# publicado no SSM pelo infra/ deste repositorio. O nome e o que a trust da role
# espera (var.service_account).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: execucao
  namespace: garageos-execucao
  annotations:
    eks.amazonaws.com/role-arn: __IRSA_ROLE_ARN__
